name: "✨ Feature Request"
description: "Suggest a new capability, workflow, or architectural improvement"
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Have an idea to improve this project? Tell us about it!"
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Limitation"
      description: "Is your feature request related to a specific problem or bottleneck?"
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Desired Behavior"
      description: "Describe how the new capability should work."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative workarounds or designs you considered."
    validations:
      required: false
