name: "🐛 Bug Report"
description: "File a reproducible defect or regression"
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a problem. Please provide detailed reproduction steps."
  - type: input
    id: version
    attributes:
      label: "Software Version / Commit SHA"
      description: "Which version or commit were you running when the issue occurred?"
      placeholder: "v1.0.0 or 3a8f9c1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: "1. Run command '...'\n2. Pass parameter '...'\n3. Observe error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior / Error Logs"
      description: "Paste exact error message or terminal stack trace."
      render: shell
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Operating System / Runtime Environment"
      options:
        - "Linux / Ubuntu"
        - "macOS"
        - "Windows"
        - "Docker / Container"
    validations:
      required: true
